# E3 (spec 6.2), CPU: ResNet-18 with the stride-2 small-image stem instead of small_cnn.
# Everything else as e0_cpu.yaml. fp32 + channels_last + torch.compile: this CPU has no AMX bf16,
# where bf16 is ~4x slower than fp32.
experiment: E3
model: resnet18s
encoding: area
size: 64
loss: weighted_ce
sampler: none_downsample
none_per_epoch: 15000
aug: {d4: true, small_rot: false, die_flip: 0.0}
optim: {lr: 1.0e-3, wd: 1.0e-4, epochs: 30, batch_size: 256, warmup_epochs: 1}
seeds: [0]
amp: true
cpu_bf16: false
channels_last: true
compile: true
eval_every: 10
