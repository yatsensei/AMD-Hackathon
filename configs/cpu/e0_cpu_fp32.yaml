# E0 baseline, CPU fp32 variant for hosts without AMX bf16 (bf16 is ~4x slower there).
# Same model/data/loss/augmentation/epochs as e0_cpu.yaml; fp32 + channels_last + torch.compile.
# Used for extra ensemble seeds. NOT "trained on AMD": env.json/summary.json say "cpu".
experiment: E0
model: small_cnn
encoding: area
size: 64
loss: weighted_ce
sampler: none_downsample
none_per_epoch: 15000
aug: {d4: true, small_rot: false, die_flip: 0.0}
optim: {lr: 1.0e-3, wd: 1.0e-4, epochs: 30, batch_size: 256, warmup_epochs: 1}
seeds: [0]
aux_features: false
amp: true
cpu_bf16: false
channels_last: true
eval_every: 10
compile: true
