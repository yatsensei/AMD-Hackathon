# E2 (spec 6.2), CPU screening: identical to e0_cpu.yaml except focal loss (gamma 2, sqrt class weights as alpha).
experiment: E2
model: small_cnn
encoding: area
size: 64
loss: focal
sampler: none_downsample
none_per_epoch: 15000
aug: {d4: true, small_rot: false, die_flip: 0.0}
optim: {lr: 1.0e-3, wd: 1.0e-4, epochs: 30, batch_size: 256, warmup_epochs: 1}
seeds: [0]
amp: true
cpu_bf16: true
channels_last: true
eval_every: 5
