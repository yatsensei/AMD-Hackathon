# E-LEAK (spec 6.2), CPU screening: identical to e0_cpu.yaml except the split protocol.
# Train+val are pooled and re-split at random by wafer (stratified by label, same val size),
# like most published WM-811K work. Val macro-F1 here minus e0_cpu's lot-grouped val macro-F1
# = how much a leaky split inflates the score. Never touches test.
experiment: E-LEAK
split_protocol: wafer_random
model: small_cnn
encoding: area
size: 64
loss: weighted_ce
sampler: none_downsample
none_per_epoch: 15000
aug: {d4: true, small_rot: false, die_flip: 0.0}
optim: {lr: 1.0e-3, wd: 1.0e-4, epochs: 30, batch_size: 256, warmup_epochs: 1}
seeds: [0]
amp: true
cpu_bf16: true
channels_last: true
eval_every: 5
